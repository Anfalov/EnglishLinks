name: Update addon names

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check sources and test changes without publishing
        type: boolean
        default: false
  schedule:
    # Monday and Thursday, 09:00 Asia/Yekaterinburg. GitHub may delay scheduled starts.
    - cron: '0 4 * * 1,4'

permissions:
  contents: write
  actions: write

concurrency:
  group: englishlinks-auto-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install updater/test dependency
        run: python -m pip install lupa==2.6

      - name: Fetch and merge names
        id: update
        run: |
          python tools/update_names.py --apply \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          import json, os
          report = json.load(open('update-results/report.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(report['changed']).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Name changes: {len(report['changes'])}\n\n")
              for source in report['sources']:
                  if source.get('freshness') == 'pinned-fallback':
                      output.write(f"- {source['source']}: using pinned file {source['version']}; latest version could not be checked/downloaded\n")
                  if source['status'] != 'parsed':
                      output.write(f"- {source['source']}: {source['status']} — {source.get('reason', '')}\n")
          PY

      - name: Test prepared update
        if: steps.update.outputs.changed == 'true'
        run: |
          python tests/run_tests.py
          python tools/package_release.py

      - name: Save source check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: update-results/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verified update
        id: publish
        if: steps.update.outputs.changed == 'true' && inputs.dry_run != true
        run: bash tools/publish_update.sh

      - name: Release the updated addon
        if: steps.publish.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.publish.outputs.sha }}
        # A GITHUB_TOKEN push does not trigger push workflows. Dispatch is explicit
        # and pinned to this update, even if main advances before release checkout.
        run: gh workflow run release.yml --ref main -f source_sha="$SOURCE_SHA"
