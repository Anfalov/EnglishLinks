name: Update addon names

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check sources and test changes without publishing
        type: boolean
        default: false
  schedule:
    # Monday and Thursday, 09:00 Asia/Yekaterinburg. GitHub may delay scheduled starts.
    - cron: '0 4 * * 1,4'

permissions:
  contents: write
  actions: write

concurrency:
  group: englishlinks-auto-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/prepare-names.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}

  release:
    needs: update
    if: needs.update.outputs.changed == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release the updated addon without another name update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.update.outputs.source_sha }}
        # GITHUB_TOKEN pushes do not trigger push workflows. Keep release.yml's
        # own run counter by dispatching it instead of calling it as a workflow.
        run: gh workflow run release.yml --ref main -f source_sha="$SOURCE_SHA" -f update_names=false
