name: Check catalog updates
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/check-quest-coverage.yml'
      - 'tools/update_names.py'
      - 'tools/catalog_sources.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 15 }}
    steps:
      # Exercise the real cutoff, queue and package on develop. Manual runs use the scheduled budget.
      - run: echo "SCAN_DEADLINE_EPOCH=$(( $(date +%s) + ${{ github.event_name == 'workflow_dispatch' && 6300 || 180 }} ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - name: Run updater in disposable checkout
        run: python tools/update_names.py --apply --scan-progress "$RUNNER_TEMP/pending.json"
      - run: python tools/source_health.py
      - run: python tests/run_tests.py && python tools/package_release.py
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: update-results/report.json
          retention-days: 14
      - name: Verify catalog routes and saved progress
        env:
          FULL_SCAN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('update-results/report.json').read_text())['sources']
          def complete(source):
              matches = [r for r in rows if r['source'] == source]
              return matches and all(r['status'] == 'parsed' for r in matches)
          for kind in ['quest', 'item', 'spell', 'achievement', 'currency', 'profession']:
              if not complete(f'wowhead-{kind}-sitemap'):
                  raise SystemExit(f'{kind} discovery failed')
          for kind in ['item', 'achievement', 'currency', 'profession']:
              if not complete(f'wowhead-bulk-{kind}'):
                  raise SystemExit(f'{kind} bulk names unavailable')
          scans = [r for r in rows if r['source'].endswith('-tooltip') and 'total' in r]
          pending = json.loads((Path(os.environ['RUNNER_TEMP'])/'pending.json').read_text())
          expected = {(r['source'].split('-')[-2], i) for r in scans for i in r['pending_ids']}
          if expected != set(map(tuple, pending)):
              raise SystemExit('Incomplete checkpoint')
          if any(r['missing_unrequested'] for r in scans):
              raise SystemExit('Did not reach every missing name; see report')
          if any(r['requested'] and not r['parsed'] for r in scans):
              raise SystemExit('No usable names for a requested tooltip type')
          if os.environ['FULL_SCAN'] == 'true' and pending:
              raise SystemExit('Full catalog check incomplete; see summary')
          PY
