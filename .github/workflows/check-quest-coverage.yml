name: Check full quest coverage
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/check-quest-coverage.yml'
      - 'tools/update_names.py'
      - 'tools/quest_sitemap.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "QUEST_DEADLINE_EPOCH=$(( $(date +%s) + 2700 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - name: Run updater in disposable checkout
        run: python tools/update_names.py --apply
      - run: python tools/source_health.py
      - run: python tests/run_tests.py && python tools/package_release.py
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: update-results/report.json
          retention-days: 14
      - name: Verify quest discovery and full tooltip coverage
        run: |
          python - <<'PY'
          import json
          rows = json.load(open('update-results/report.json'))['sources']
          discovery = [r for r in rows if r['source'] == 'wowhead-quest-sitemap']
          scan = [r for r in rows if r['source'] == 'wowhead-forever-quest-tooltip' and 'total' in r]
          if not discovery or any(r['status'] != 'parsed' for r in discovery + scan):
              raise SystemExit('Quest coverage incomplete; see report and job summary')
          PY
