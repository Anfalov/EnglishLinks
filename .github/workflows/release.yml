name: Build and release addon

on:
  push:
    branches: [main]
    paths: ["EnglishLinks/**"]
  workflow_dispatch:
    inputs:
      update_names:
        description: Refresh names before releasing
        type: boolean
        default: true
      source_sha:
        description: Exact main commit (empty means current main)
        required: false
        type: string

permissions:
  contents: write

# Keep run numbers independent. Name preparation has a shared publication lock
# and rejects stale main snapshots instead of overwriting concurrent work.
concurrency:
  group: addon-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.update_names == true)
    uses: ./.github/workflows/prepare-names.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}

  release:
    needs: update
    # A deliberately skipped update must not skip the release; a failure must.
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.update.result == 'success' || needs.update.result == 'skipped')
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.update.outputs.source_sha || inputs.source_sha || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Record release source
        id: source
        run: |
          source_sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare version
        id: release
        run: >-
          python tools/prepare_release.py
          --run-number "$GITHUB_RUN_NUMBER"
          --run-id "$GITHUB_RUN_ID"
          --source "${{ steps.source.outputs.sha }}"

      - name: Package prepared addon
        run: python tools/package_release.py

      - name: Upload installable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/EnglishLinks-${{ steps.release.outputs.version }}.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Tag release snapshot
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --update
            git commit --allow-empty -m "Release $VERSION" -m "Release-Run-ID: $GITHUB_RUN_ID"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Automatic build from commit %s.\n\nInstall **EnglishLinks-%s.zip**.\n' \
              "$SOURCE_SHA" "$VERSION" > dist/release-notes.md
            gh release create "$TAG" --verify-tag --draft \
              --title "EnglishLinks $VERSION" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" \
            "dist/EnglishLinks-$VERSION.zip" --clobber
          gh release edit "$TAG" --draft=false

  curseforge:
    name: Upload release ZIP to CurseForge
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download the published GitHub ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release download "$TAG" --pattern "EnglishLinks-$VERSION.zip" --dir dist

      - name: Upload the same ZIP to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: python tools/upload_curseforge.py --version "$VERSION" --zip "dist/EnglishLinks-$VERSION.zip"
