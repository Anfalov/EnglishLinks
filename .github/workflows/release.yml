name: Build and release addon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Different pushes must all build; only attempts of the SAME run share a lock.
concurrency:
  group: addon-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install lupa==2.6

      - name: Prepare version
        id: release
        run: >-
          python tools/prepare_release.py
          --run-number "$GITHUB_RUN_NUMBER"
          --run-id "$GITHUB_RUN_ID"
          --source "$GITHUB_SHA"

      - name: Verify addon and release automation
        run: python tests/run_tests.py --csv data/ItemSparse.1.60.1.70124.csv --data-dir data

      - name: Build ZIP files
        run: python tools/package_release.py

      - name: Upload installable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/EnglishLinks-${{ steps.release.outputs.version }}.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Tag verified release snapshot
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --update
            git commit -m "Release $VERSION" -m "Release-Run-ID: $GITHUB_RUN_ID"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Automatic build from commit %s.\n\nInstall **EnglishLinks-%s.zip**. The CurseForge kit is for the author, not for installation.\n' \
              "$GITHUB_SHA" "$VERSION" > dist/release-notes.md
            gh release create "$TAG" --verify-tag --draft \
              --title "EnglishLinks $VERSION" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" \
            "dist/EnglishLinks-$VERSION.zip" \
            "dist/EnglishLinks-$VERSION-CurseForge-kit.zip" \
            "dist/EnglishLinks-$VERSION-SHA256SUMS.txt" --clobber
          gh release edit "$TAG" --draft=false
